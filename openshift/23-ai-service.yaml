# 23-ai-service.yaml — Assistant IA (chatbot, moteur Google Gemini)
# Le gateway route deja /api/ai/** -> lb://ai-service (via config-service).
# Cle Gemini : secret ai-secret (a renseigner).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels: { app: ai-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai-service } }
  template:
    metadata: { labels: { app: ai-service } }
    spec:
      enableServiceLinks: false
      containers:
      - name: app
        image: quay.io/akh901736/ai-service:latest
        imagePullPolicy: Always
        ports: [{ containerPort: 8088 }]
        env:
        - { name: JAVA_OPTS, value: "-Xms128m -Xmx320m" }
        - { name: SPRING_CONFIG_IMPORT, valueFrom: { configMapKeyRef: { name: eventify-config, key: CONFIG_IMPORT } } }
        - { name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, valueFrom: { configMapKeyRef: { name: eventify-config, key: EUREKA_URL } } }
        - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, valueFrom: { configMapKeyRef: { name: eventify-config, key: KEYCLOAK_ISSUER_URI } } }
        # URLs internes des services consommes par l'assistant (catalogue + avis)
        - { name: APP_CATALOG_URL,  value: "http://event-service:8082" }
        - { name: APP_FEEDBACK_URL, value: "http://feedback-service:8086" }
        # Cle Gemini (palier gratuit) — depuis le secret ai-secret
        - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: ai-secret, key: GEMINI_API_KEY } } }
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "1",    memory: "512Mi" }
        startupProbe:
          httpGet: { path: /actuator/health, port: 8088 }
          periodSeconds: 10
          failureThreshold: 40
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: 8088 }
          periodSeconds: 15
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 8088 }
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata: { name: ai-service }
spec:
  selector: { app: ai-service }
  ports: [{ port: 8088, targetPort: 8088 }]
