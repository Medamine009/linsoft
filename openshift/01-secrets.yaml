# 01-secrets.yaml — VALEURS DE DÉMONSTRATION UNIQUEMENT
#
# Ce fichier est versionné : les valeurs ci-dessous sont donc PUBLIQUES.
# Ce sont volontairement les mêmes défauts que docker-compose.yml
# (postgres/password, guest/guest, admin/admin), pour qu'un déploiement de
# démonstration sur un sandbox fonctionne en une seule commande.
#
# NE PAS UTILISER TEL QUEL hors démonstration.
#
# Pour un déploiement réel, ne pas appliquer ce fichier : générer des secrets
# aléatoires qui ne transitent jamais par Git —
#
#     ./openshift/create-secrets.sh
#
# Le script est rejouable et met à jour les secrets existants.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_DB: user_db
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
