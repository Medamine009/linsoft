# 20-discovery-service.yaml — Eureka (registre de services)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  labels: { app: discovery-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: discovery-service } }
  template:
    metadata:
      labels: { app: discovery-service }
    spec:
      containers:
      - name: app
        image: quay.io/akh901736/discovery-service:latest
        imagePullPolicy: Always
        ports: [{ containerPort: 8761 }]
        env:
        - { name: JAVA_OPTS, value: "-Xms256m -Xmx512m" }
        resources:
          requests: { cpu: "100m", memory: "384Mi" }
          limits:   { cpu: "500m", memory: "640Mi" }
        readinessProbe:
          httpGet: { path: /actuator/health, port: 8761 }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /actuator/health, port: 8761 }
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
spec:
  selector: { app: discovery-service }
  ports:
  - { port: 8761, targetPort: 8761 }
