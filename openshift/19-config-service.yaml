# 19-config-service.yaml — Spring Cloud Config Server
# Sert TOUTE la configuration (Eureka, Keycloak, Mongo, routes du gateway…).
# Doit démarrer AVANT discovery-service et les microservices.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  labels: { app: config-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: config-service } }
  template:
    metadata: { labels: { app: config-service } }
    spec:
      containers:
      - name: app
        image: quay.io/akh901736/config-service:latest
        imagePullPolicy: Always
        ports: [{ containerPort: 8888 }]
        env:
        - { name: JAVA_OPTS, value: "-Xms128m -Xmx256m" }
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "400m", memory: "384Mi" }
        readinessProbe:
          httpGet: { path: /actuator/health, port: 8888 }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /actuator/health, port: 8888 }
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: { name: config-service }
spec:
  selector: { app: config-service }
  ports: [{ port: 8888, targetPort: 8888 }]
