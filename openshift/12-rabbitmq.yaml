# 12-rabbitmq.yaml — RabbitMQ pour le bus event-driven (registration → notification)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: { app: rabbitmq }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - { containerPort: 5672,  name: amqp }
        - { containerPort: 15672, name: management }
        envFrom:
        - secretRef: { name: rabbitmq-secret }
        readinessProbe:
          tcpSocket: { port: 5672 }
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 5672 }
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: rabbitmq }
  ports:
  - { name: amqp,       port: 5672,  targetPort: 5672 }
  - { name: management, port: 15672, targetPort: 15672 }
