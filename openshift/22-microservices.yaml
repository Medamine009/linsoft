# 22-microservices.yaml — les 6 microservices metier
# (user, event, registration, notification, ticket, feedback)
#
# Cablage OpenShift :
#  - enableServiceLinks: false  -> supprime les variables "service-link" k8s
#    (ex: RABBITMQ_PORT=tcp://...) qui polluaient les placeholders du config-service.
#  - SPRING_CONFIG_IMPORT -> config-service (routes + config de base).
#  - Variables Spring STANDARD (SPRING_DATA_MONGODB_URI, SPRING_DATASOURCE_URL,
#    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, ...) surchargent les defauts localhost.
#  - Variables PLAIN (RABBITMQ_HOST/PORT/USER/PASSWORD, MAIL_HOST/PORT) : ce sont
#    les noms attendus par les placeholders ${...} des fichiers du config-service.
#  - startupProbe : laisse ~400s au demarrage (JVM lente sur petit CPU) avant que
#    readiness/liveness ne prennent le relais.

# ==================== USER-SERVICE ====================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels: { app: user-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      enableServiceLinks: false
      containers:
      - name: app
        image: quay.io/akh901736/user-service:latest
        imagePullPolicy: Always
        ports: [{ containerPort: 8081 }]
        env:
        - { name: JAVA_OPTS, value: "-Xms128m -Xmx320m" }
        - { name: SPRING_CONFIG_IMPORT, valueFrom: { configMapKeyRef: { name: eventify-config, key: CONFIG_IMPORT } } }
        - { name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, valueFrom: { configMapKeyRef: { name: eventify-config, key: EUREKA_URL } } }
        - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, valueFrom: { configMapKeyRef: { name: eventify-config, key: KEYCLOAK_ISSUER_URI } } }
        - { name: SPRING_DATASOURCE_URL, valueFrom: { configMapKeyRef: { name: eventify-config, key: POSTGRES_JDBC_URL } } }
        - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } } }
        - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } } }
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "1",    memory: "512Mi" }
        startupProbe:
          httpGet: { path: /actuator/health, port: 8081 }
          periodSeconds: 10
          failureThreshold: 40
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: 8081 }
          periodSeconds: 15
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 8081 }
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata: { name: user-service }
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]

