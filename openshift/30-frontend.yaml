# 30-frontend.yaml — Frontend Angular (servi par nginx, proxie /api -> api-gateway)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: app
        image: quay.io/akh901736/frontend:latest
        imagePullPolicy: Always
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: "50m",  memory: "64Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
  - { port: 8080, targetPort: 8080 }
---
# Route publique — c'est l'URL de l'app que les utilisateurs verront
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: eventify
spec:
  to: { kind: Service, name: frontend }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
