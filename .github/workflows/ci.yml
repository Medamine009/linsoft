name: CI

# Pipeline d'intégration continue — LINSOFT Learning Center
#
# Enchaînement : qualité + tests (back et front en parallèle) -> construction
# des images -> analyse de vulnérabilités -> publication sur GHCR.
#
# Les tests d'intégration Testcontainers s'exécutent réellement ici : le runner
# Ubuntu expose un socket Docker standard, contrairement à certains postes
# Windows où Docker Desktop refuse l'accès au client Java.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════
  # 1. Tests backend — unitaires, API/sécurité, intégration
  # ══════════════════════════════════════════════════════════
  backend-tests:
    name: Backend — tests et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: JDK ${{ env.JAVA_VERSION }} + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Testcontainers a besoin d'un démon joignable. On le vérifie explicitement :
      # sans cela les tests d'intégration seraient silencieusement ignorés et le
      # pipeline donnerait une fausse assurance.
      - name: Vérification de la disponibilité de Docker
        run: |
          docker info > /dev/null
          echo "Démon Docker joignable : les tests Testcontainers s'exécuteront."

      - name: Compilation, tests unitaires et tests d'intégration
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      # Garantit qu'aucun test d'intégration n'a été ignoré faute de Docker.
      - name: Contrôle — aucun test d'intégration ignoré
        working-directory: backend
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' */target/failsafe-reports/*.xml 2>/dev/null \
                    | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Tests d'intégration ignorés : $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::Des tests d'intégration ont été ignorés alors que Docker est disponible."
            exit 1
          fi

      - name: Rapport de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests backend
          path: 'backend/*/target/*-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Publication des rapports de couverture JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: backend/*/target/site/jacoco/
          retention-days: 14

      - name: Conservation des JAR pour la construction des images
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # 2. Analyse statique — Checkstyle + SpotBugs
  # ══════════════════════════════════════════════════════════
  backend-quality:
    name: Backend — analyse statique
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Profil `quality` : Checkstyle et SpotBugs. Volontairement informatifs
      # (failOnViolation=false) le temps de résorber la dette existante ; la
      # bascule en bloquant se fait en passant -Dcheckstyle.failOnViolation=true.
      - name: Checkstyle et SpotBugs
        working-directory: backend
        run: mvn -B --no-transfer-progress -Pquality verify -DskipTests

      - name: Publication des rapports qualité
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            backend/*/target/checkstyle-result.xml
            backend/*/target/spotbugsXml.xml
          retention-days: 14

  # ══════════════════════════════════════════════════════════
  # 2 bis. SonarCloud — analyse de qualité et de sécurité
  # ══════════════════════════════════════════════════════════
  #
  # Conditionné à la présence du secret SONAR_TOKEN : sans lui, le job est
  # simplement ignoré. Un job Sonar qui échoue faute de jeton ferait échouer
  # tout le pipeline pour une raison qui n'est pas un défaut du code.
  #
  # Activation : créer un projet sur sonarcloud.io, puis ajouter les secrets
  # SONAR_TOKEN et la variable SONAR_PROJECT_KEY dans les paramètres du dépôt.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend-tests]
    timeout-minutes: 25
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Vérification de la configuration Sonar
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN absent — analyse SonarCloud ignorée."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # `fetch-depth: 0` : Sonar attribue les problèmes à leur auteur et à leur
      # date, ce qui nécessite l'historique complet.
      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: steps.check.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Sonar exige les rapports JaCoCo : on rejoue les tests plutôt que de
      # dépendre d'un artefact, pour que l'analyse porte sur l'état courant.
      - name: Analyse SonarCloud
        if: steps.check.outputs.configured == 'true'
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B --no-transfer-progress verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="${{ vars.SONAR_ORGANIZATION }}" \
            -Dsonar.projectKey="${{ vars.SONAR_PROJECT_KEY }}"

  # ══════════════════════════════════════════════════════════
  # 3. Frontend — tests unitaires et build de production
  # ══════════════════════════════════════════════════════════
  frontend-tests:
    name: Frontend — tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }} + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps : requis par les pairs CoreUI, comme dans le Dockerfile.
      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # Les tests tournent dans un vrai Chromium (Vitest browser mode).
      - name: Installation du navigateur Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests unitaires
        working-directory: frontend
        run: npm run test-ci

      - name: Build de production
        working-directory: frontend
        run: npm run build

      - name: Conservation du bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # 4. Images Docker + analyse de vulnérabilités (Trivy)
  # ══════════════════════════════════════════════════════════
  docker-build:
    name: Images Docker et scan de sécurité
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - config-service
          - discovery-service
          - api-gateway
          - user-service
          - event-service
          - registration-service
          - notification-service
          - ticket-service
          - feedback-service
          - ai-service

    steps:
      - uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules, alors que
      # `github.repository` conserve la casse du compte (Medamine009/linsoft).
      # Sans cette normalisation, la publication échoue après un `docker login`
      # pourtant réussi — symptôme trompeur.
      - name: Normalisation du nom d'image
        run: echo "IMAGE_BASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Les Dockerfile backend copient un JAR déjà construit : on réutilise
      # l'artefact du job de test plutôt que de recompiler dans chaque image.
      # Un seul build Maven pour dix images, et l'image publiée est exactement
      # celle qui a passé les tests.
      - name: Récupération des JAR testés
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: backend/

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: false
          load: true
          tags: linsoft/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Analyse de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: linsoft/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Remontée des vulnérabilités dans l'onglet Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # ─── Publication sur GHCR (branche principale uniquement) ───
      # Aucun identifiant en dur : GITHUB_TOKEN est fourni par la plateforme.
      - name: Connexion au registre GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  # ══════════════════════════════════════════════════════════
  # 5. Image frontend (build multi-stage, contexte différent)
  # ══════════════════════════════════════════════════════════
  docker-frontend:
    name: Image Docker frontend
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Voir le job précédent : GHCR exige un nom d'image en minuscules.
      - name: Normalisation du nom d'image
        run: echo "IMAGE_BASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Le Dockerfile frontend est déjà multi-stage (build Node puis nginx
      # non-root) : il se construit depuis les sources, sans artefact préalable.
      - name: Construction de l'image frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          load: true
          tags: linsoft/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Analyse de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: linsoft/frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Remontée des vulnérabilités
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Connexion au registre GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha,scope=frontend

  # ══════════════════════════════════════════════════════════
  # 6. Tests de bout en bout (Playwright) sur la plateforme réelle
  # ══════════════════════════════════════════════════════════
  #
  # Volontairement limité à la branche principale et au déclenchement manuel :
  # le scénario démarre 16 conteneurs (Keycloak, 3 bases, RabbitMQ, 10 JVM,
  # frontend). C'est lourd pour un runner GitHub standard, et l'imposer à
  # chaque pull request rendrait le retour trop lent.
  e2e:
    name: Tests E2E (plateforme complète)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Les images backend copient un JAR déjà construit.
      - name: Construction des JAR
        working-directory: backend
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Démarrage de la plateforme
        run: docker compose up -d --build

      # Chaque service publie /actuator/health : on attend un état réellement
      # sain plutôt qu'un `sleep` arbitraire.
      - name: Attente de la disponibilité des services
        run: |
          set -e
          for port in 8888 8761 8081 8082 8083 8084 8086 8087 8088 8080; do
            echo "Attente du service sur le port $port…"
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/actuator/health" > /dev/null 2>&1; then
                echo "  port $port : UP"; break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::Le service sur le port $port n'est jamais devenu sain."
                docker compose ps; docker compose logs --tail=80
                exit 1
              fi
              sleep 5
            done
          done
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4200/ > /dev/null 2>&1 && break
            [ "$i" -eq 60 ] && { echo "::error::Frontend indisponible."; exit 1; }
            sleep 5
          done

      # Keycloak est la dépendance du script de seed (authentification admin et
      # création des comptes) mais n'expose pas d'endpoint Actuator : l'attente
      # ci-dessus ne le couvrait pas. Sans ce contrôle, le seed pouvait démarrer
      # avant l'import du realm — c'est ce qui l'a fait échouer.
      - name: Attente de Keycloak et du realm
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8085/realms/pfe-events/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "Realm pfe-events disponible."; break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Keycloak ou le realm pfe-events n'est jamais devenu disponible."
              docker compose logs keycloak --tail=120
              exit 1
            fi
            sleep 5
          done

      # pwsh est préinstallé sur les runners Ubuntu ; le script est
      # multi-plateforme et rejouable.
      - name: Jeu de données de test
        run: pwsh -File scripts/seed-test-data.ps1

      - name: Journaux Keycloak si le seed a échoué
        if: failure()
        run: docker compose logs keycloak --tail=120

      - name: Installation des dépendances frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Installation du navigateur Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        working-directory: frontend
        run: npm run e2e

      - name: Publication du rapport Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Journaux des conteneurs en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      - name: Arrêt de la plateforme
        if: always()
        run: docker compose down -v

  # ══════════════════════════════════════════════════════════
  # 7. Synthèse — porte de qualité
  # ══════════════════════════════════════════════════════════
  ci-summary:
    name: Synthèse du pipeline
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-quality, frontend-tests, docker-build, docker-frontend]
    if: always()
    steps:
      - name: Verdict
        run: |
          echo "Tests backend  : ${{ needs.backend-tests.result }}"
          echo "Qualité        : ${{ needs.backend-quality.result }}"
          echo "Tests frontend : ${{ needs.frontend-tests.result }}"
          echo "Images backend : ${{ needs.docker-build.result }}"
          echo "Image frontend : ${{ needs.docker-frontend.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] \
          || [ "${{ needs.frontend-tests.result }}" != "success" ] \
          || [ "${{ needs.docker-build.result }}" != "success" ] \
          || [ "${{ needs.docker-frontend.result }}" != "success" ]; then
            echo "::error::Le pipeline a échoué sur au moins une étape bloquante."
            exit 1
          fi
          echo "Pipeline vert."
