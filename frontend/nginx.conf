# nginx config pour EVENTIFY frontend
# - Sert l'app Angular (SPA fallback)
# - Proxie /api/* vers le service api-gateway (Spring Cloud Gateway)

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression gzip (perf)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache long pour les assets fingerprintés
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|gif|png|jpg|jpeg|webp|ico|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Proxy /api -> api-gateway (Spring Cloud Gateway)
    # En docker-compose et OpenShift, le service s'appelle "api-gateway" sur le port 8080
    location /api/ {
        proxy_pass         http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback : toute route inconnue -> index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de logs pour les health checks (optionnel)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
