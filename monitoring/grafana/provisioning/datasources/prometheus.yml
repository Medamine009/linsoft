# Source de données provisionnée automatiquement au démarrage de Grafana :
# aucune configuration manuelle n'est nécessaire après un `docker compose up`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
