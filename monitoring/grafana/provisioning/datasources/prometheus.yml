# Source de données provisionnée automatiquement au démarrage de Grafana :
# aucune configuration manuelle n'est nécessaire après un `docker compose up`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # UID figé : les tableaux de bord provisionnés y font référence. Sans lui,
    # Grafana en génère un aléatoire et les panneaux restent vides.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
